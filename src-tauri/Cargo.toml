[package]
name = "smartwiki"
version = "1.0.0"
description = "SmartWiki — AI wiki-документация репозиториев (desktop)"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sled = "0.34"
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
sha2 = "0.10"
zstd = { version = "0.13", features = ["zdict_builder"] }
tar = "0.4"
ignore = "0.4"
rfd = "0.15"
base64 = "0.22"
zip = { version = "2", default-features = false, features = ["deflate"] }
xdp-util = { path = "../../xdp-rust" }

[profile.release]
lto = true
strip = true
